<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient: Rich Earth Forest Green -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08241a" />
      <stop offset="50%" stop-color="#0d3123" />
      <stop offset="100%" stop-color="#144632" />
    </linearGradient>

    <!-- Leaf 1 (Left): Vibrant Fresh Emerald Gradient -->
    <linearGradient id="leafLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Leaf 2 (Right): Sunlit Young Leaf Gradient -->
    <linearGradient id="leafRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Golden Bridge ("Setu") Arch Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Sun Accent Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>

    <!-- Shadow for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base / Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#22543d" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Agricultural Bridge / "Setu" Arch across the base -->
  <path d="M 12 50 C 24 43, 40 43, 52 50" stroke="url(#bridgeGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
  <!-- Fertile soil / river horizon accent -->
  <path d="M 17 54 C 27 49, 37 49, 47 54" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.45" />

  <!-- The "Kheti" Sprout Group -->
  <g filter="url(#softShadow)">
    <!-- Central Living Stem -->
    <path d="M 32 46 C 32 36, 30 26, 37 17" stroke="#6ee7b7" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Left Broad Leaf (Rooted & Nourishing) -->
    <path d="M 31 34 C 18 34, 15 22, 26 18 C 32 23, 31 30, 31 34 Z" fill="url(#leafLeft)" />
    <!-- Subtle leaf vein -->
    <path d="M 30 33 C 25 28, 22 24, 22 20" stroke="#a7f3d0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Right Rising Leaf (Growth & Market Reach) -->
    <path d="M 34 26 C 45 23, 48 12, 37 9 C 33 14, 34 21, 34 26 Z" fill="url(#leafRight)" />
    <!-- Subtle leaf vein -->
    <path d="M 35 24 C 38 19, 41 16, 42 12" stroke="#ecfdf5" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Morning Sun / Golden Harvest Sprout Pip -->
    <circle cx="47" cy="14" r="3.2" fill="url(#sunGlow)" />
  </g>
</svg>
