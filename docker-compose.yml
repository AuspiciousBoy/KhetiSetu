services:
  mongo:
    image: mongo:7.0
    container_name: khetisetu-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: khetisetu
    volumes:
      - mongo_data:/data/db
    networks:
      - khetisetu-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: khetisetu-api
    restart: always
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/khetisetu
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: http://localhost:80
      CORS_ORIGINS: http://localhost:80,http://localhost:5173
    volumes:
      - uploads_data:/app/uploads
    networks:
      - khetisetu-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: khetisetu-web
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - khetisetu-net

networks:
  khetisetu-net:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
